[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soroscan-webhook-simulator"
version = "0.1.0"
description = "Standalone SoroScan webhook delivery simulator for local testing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SoroScan Team", email = "team@soroscan.io" }
]
keywords = ["stellar", "soroban", "webhooks", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.2.0",
]

[project.scripts]
webhook-simulator = "webhook_simulator.cli:main"
soroscan-webhook-simulator = "webhook_simulator.cli:main"

[project.urls]
Homepage = "https://soroscan.io"
Documentation = "https://docs.soroscan.io"
Repository = "https://github.com/SoroScan/soroscan"

[tool.hatch.build.targets.wheel]
packages = ["webhook_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:django"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"examples/receiver.py" = ["N802"]
"tests/conftest.py" = ["N802"]
