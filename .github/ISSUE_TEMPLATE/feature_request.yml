name: Feature request
description: Suggest an idea or improvement for SoroScan
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please search existing issues first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem are you trying to solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see.
    validations:
      required: true
  - type: textarea
    id: benefits
    attributes:
      label: Expected behavior or benefits
      description: How would this work once implemented, and what does it improve?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Alternatives considered, implementation notes, links, or screenshots.
    validations:
      required: false
