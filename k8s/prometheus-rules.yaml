apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: soroscan-alerts
  namespace: soroscan
  labels:
    app: soroscan
spec:
  groups:
    - name: soroscan.api-sla
      rules:
        - alert: SoroScanApiErrorRateHigh
          expr: |
            100 * sum by (service) (rate(soroscan_http_responses_total{status_class="5xx"}[5m]))
              / clamp_min(sum by (service) (rate(soroscan_http_responses_total[5m])), 0.001) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "SoroScan API error rate exceeds the 1% SLA threshold"
            description: "5xx responses are above 1% for service {{ $labels.service }}."
            root_cause_query: 'topk(5, sum by (view,error_type) (rate(soroscan_http_responses_total{status_class="5xx",service="{{ $labels.service }}"}[5m])))'
            runbook_url: "https://github.com/SoroScan/soroscan/blob/main/docs/deployment/runbooks.md"
        - alert: SoroScanApiErrorRateCritical
          expr: |
            100 * sum by (service) (rate(soroscan_http_responses_total{status_class="5xx"}[5m]))
              / clamp_min(sum by (service) (rate(soroscan_http_responses_total[5m])), 0.001) > 5
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "SoroScan API critical error rate exceeds 5%"
            description: "5xx responses are above 5% for service {{ $labels.service }}."
            root_cause_query: 'topk(5, sum by (view,error_type) (rate(soroscan_http_responses_total{status_class="5xx",service="{{ $labels.service }}"}[5m])))'
            runbook_url: "https://github.com/SoroScan/soroscan/blob/main/docs/deployment/runbooks.md"
    - name: soroscan.celery
      rules:
        - alert: SoroScanCeleryQueueDepthHigh
          expr: soroscan_celery_queue_depth > 100
          for: 10m
          labels:
            severity: warning
            service: soroscan-celery
          annotations:
            summary: "Celery queue {{ $labels.queue }} is backed up"
            description: "Queue depth has exceeded 100 pending tasks for 10 minutes."
        - alert: SoroScanCeleryFailureRateHigh
          expr: |
            100 * sum(rate(soroscan_celery_tasks_total{status="failure"}[10m]))
              / clamp_min(sum(rate(soroscan_celery_tasks_total[10m])), 0.001) > 5
          for: 5m
          labels:
            severity: critical
            service: soroscan-celery
          annotations:
            summary: "Celery task failure rate exceeds 5%"
            root_cause_query: 'topk(5, sum(rate(soroscan_celery_tasks_total{status="failure"}[10m])) by (task_name,error_type))'
    - name: soroscan.incident-playbooks
      rules:
        - alert: SoroScanEventIngestionLag
          expr: |
            (time() - soroscan_contract_last_event_timestamp_seconds) > 900
          for: 5m
          labels:
            severity: critical
            service: soroscan-ingest
            playbook: event_ingestion_lag
          annotations:
            summary: "Event ingestion lag exceeds 15 minutes"
            description: "Contract {{ $labels.contract_id }} has not received events within the lag threshold."
            runbook_url: "https://github.com/SoroScan/soroscan/blob/main/docs/deployment/playbooks/event-ingestion-lag.md"
        - alert: SoroScanWebhookFailureBurst
          expr: |
            sum(rate(soroscan_webhook_deliveries_total{status=~"failed|dead_letter"}[10m])) by (subscription_id)
              > 0.5
          for: 5m
          labels:
            severity: critical
            service: soroscan-webhooks
            playbook: webhook_delivery_failure_burst
          annotations:
            summary: "Webhook delivery failure burst detected"
            description: "Subscription {{ $labels.subscription_id }} is failing deliveries rapidly."
            runbook_url: "https://github.com/SoroScan/soroscan/blob/main/docs/deployment/playbooks/webhook-delivery-failure-burst.md"
        - alert: SoroScanDbPoolExhausted
          expr: |
            100 * soroscan_db_pool_connections{state="total"}
              / clamp_min(soroscan_db_pool_configured_limit, 1) > 90
          for: 2m
          labels:
            severity: critical
            service: soroscan-backend
            playbook: database_connection_pool_exhausted
          annotations:
            summary: "Database connection pool utilization exceeds 90%"
            description: "Pool usage is critically high; check /api/meta/db-pool/."
            runbook_url: "https://github.com/SoroScan/soroscan/blob/main/docs/deployment/playbooks/database-connection-pool-exhausted.md"
        - alert: SoroScanRpcEndpointUnavailable
          expr: |
            sum(rate(soroscan_ingest_errors_total{error_type="rpc_error"}[10m])) > 0.1
          for: 5m
          labels:
            severity: critical
            service: soroscan-ingest
            playbook: rpc_endpoint_unavailable
          annotations:
            summary: "Soroban RPC endpoint unavailable or erroring"
            description: "RPC errors are elevated; failover or pause ingest may be required."
            runbook_url: "https://github.com/SoroScan/soroscan/blob/main/docs/deployment/playbooks/rpc-endpoint-unavailable.md"
