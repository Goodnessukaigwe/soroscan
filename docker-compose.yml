services:
  db:
    image: postgres:15-alpine
    container_name: soroscan-db
    environment:
      POSTGRES_DB: soroscan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - soroscan-network

  redis:
    image: redis:7-alpine
    container_name: soroscan-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - soroscan-network

  web:
    build:
      context: ./django-backend
      dockerfile: Dockerfile
    container_name: soroscan-web
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./django-backend:/app
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - ./django-backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/soroscan
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - FRONTEND_BASE_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soroscan-network
    stdin_open: true
    tty: true

  worker-high:
    build:
      context: ./django-backend
      dockerfile: Dockerfile
    container_name: soroscan-worker-high
    command: celery -A soroscan worker --loglevel=info --concurrency=4 --queues=high_priority --soft-time-limit=30
    volumes:
      - ./django-backend:/app
    env_file:
      - ./django-backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/soroscan
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soroscan-network

  worker-default:
    build:
      context: ./django-backend
      dockerfile: Dockerfile
    container_name: soroscan-worker-default
    command: celery -A soroscan worker --loglevel=info --concurrency=2 --queues=default --soft-time-limit=30
    volumes:
      - ./django-backend:/app
    env_file:
      - ./django-backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/soroscan
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soroscan-network

  worker-low:
    build:
      context: ./django-backend
      dockerfile: Dockerfile
    container_name: soroscan-worker-low
    command: celery -A soroscan worker --loglevel=info --concurrency=2 --queues=low_priority --soft-time-limit=30
    volumes:
      - ./django-backend:/app
    env_file:
      - ./django-backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/soroscan
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soroscan-network

  worker-backfill:
    build:
      context: ./django-backend
      dockerfile: Dockerfile
    container_name: soroscan-worker-backfill
    command: celery -A soroscan worker --loglevel=info --concurrency=1 --queues=backfill --soft-time-limit=30
    volumes:
      - ./django-backend:/app
    env_file:
      - ./django-backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/soroscan
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soroscan-network

  beat:
    build:
      context: ./django-backend
      dockerfile: Dockerfile
    container_name: soroscan-beat
    command: celery -A soroscan beat --loglevel=info
    volumes:
      - ./django-backend:/app
    env_file:
      - ./django-backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/soroscan
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soroscan-network

  webhook-simulator:
    profiles: ["tools"]
    build:
      context: ./tools/webhook-simulator
      dockerfile: Dockerfile
    image: soroscan-webhook-simulator:local
    container_name: soroscan-webhook-simulator
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SOROSCAN_WEBHOOK_SECRET: ${SOROSCAN_WEBHOOK_SECRET:-test-secret}
      SOROSCAN_WEBHOOK_URL: ${SOROSCAN_WEBHOOK_URL:-}
      WEBHOOK_ED25519_SIGNING_SEED: ${WEBHOOK_ED25519_SIGNING_SEED:-}
    volumes:
      - ./tools/webhook-simulator/examples:/examples:ro
    networks:
      - soroscan-network

  frontend:
    user: root
    build:
      context: .
      dockerfile: soroscan-frontend/Dockerfile.frontend
    container_name: soroscan-frontend
    command: sh -c "pnpm install && pnpm dev"
    volumes:
      - ./soroscan-frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - BACKEND_BASE_URL=http://web:8000
      - WATCHPACK_POLLING=true
    depends_on:
      - web
    networks:
      - soroscan-network

volumes:
  postgres_data:

networks:
  soroscan-network:
    driver: bridge
